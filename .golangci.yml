version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - bodyclose
    - copyloopvar
    - noctx
    - perfsprint
    - unconvert
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/mortogo321/go-fiber-api
